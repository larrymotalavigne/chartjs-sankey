name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Run tests (with coverage thresholds)
      run: npm run test:coverage

    - name: Check type declarations
      run: npm run test:types

    - name: Check published package
      run: npm run test:package

    - name: Upload build artifacts
      if: matrix.node-version == '22.x'
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  visual:
    # Pixel comparison of reference diagrams in headless Chromium
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Build
      run: npm run build

    - name: Visual regression tests
      run: npm run test:visual

    - name: Upload visual differences
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-diff
        path: test/visual/__diff__/
